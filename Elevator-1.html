<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Elevator Simulator</title>

    <style>
        body{
            font-family:Arial;
            background:#222;
            color:white;
            text-align:center;
        }

        .wrap{
            display:flex;
            justify-content:center;
            gap:30px;
        }

        .shaft{
            position:relative;
            width:120px;
            height:600px;
            border:3px solid white;
        }

        .elevator{
            position:absolute;
            left:10px;
            bottom:0;
            width:100px;
            height:55px;
            background:#2196f3;
            transition:bottom 1s;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:20px;
            font-weight:bold;
        }

        button{
            margin:2px;
            padding:8px 12px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h2>Smart Elevator Simulation</h2>

<button onclick="toggleDark()">Dark / Light Mode</button>

<h3>
Status :
<span id="status">Idle</span>

&nbsp;&nbsp;

Current Floor :
<span id="floorDisplay">1</span>

&nbsp;&nbsp;

Weight :
<span id="weightDisplay">0</span> kg
</h3>

<div class="wrap">

    <div class="shaft">
        <div id="elevator" class="elevator">
            1
        </div>
    </div>

    <div>

        <div id="buttons"></div>

        <hr>

        <button onclick="openDoor()">Open Door</button>

        <button onclick="closeDoor()">Close Door</button>

        <br><br>

        <button onclick="stopLift()">Emergency Stop</button>

        <button onclick="alarm()">Alarm</button>

        <br><br>

        <button onclick="changeWeight(10)">+10 kg</button>

        <button onclick="changeWeight(-10)">-10 kg</button>

        <br><br>

        <label>
            <input type="checkbox" id="doorBlock">
            Door Blocked
        </label>

    </div>

</div>

<script>

let currentFloor = 1;
let queue = [];
let busy = false;
let weight = 0;
let stopped = false;

const elevator = document.getElementById("elevator");
const status = document.getElementById("status");
const floorDisplay = document.getElementById("floorDisplay");
const weightDisplay = document.getElementById("weightDisplay");

for(let i=10;i>=1;i--)
{
    buttons.innerHTML +=
    `<button onclick="callFloor(${i})">
        Floor ${i}
    </button><br>`;
}

function speak(text)
{
    speechSynthesis.speak(
        new SpeechSynthesisUtterance(text)
    );
}

function callFloor(floor)
{
    if(!queue.includes(floor))
    {
        queue.push(floor);
    }

    runElevator();
}

async function runElevator()
{
    if(busy || stopped || queue.length==0)
        return;

    busy = true;

    let target = queue.shift();

    status.innerHTML =
        target>currentFloor ?
        "Moving Up" :
        "Moving Down";

    while(currentFloor != target && !stopped)
    {
        await new Promise(r=>setTimeout(r,800));

        if(target>currentFloor)
            currentFloor++;
        else
            currentFloor--;

        updateElevator();
    }

    status.innerHTML="Arrived";

    speak("Floor " + currentFloor);

    openDoor();

    await new Promise(r=>setTimeout(r,1500));

    closeDoor();

    busy=false;

    runElevator();
}

function updateElevator()
{
    elevator.style.bottom =
        ((currentFloor-1)*60)+"px";

    elevator.innerHTML=currentFloor;

    floorDisplay.innerHTML=currentFloor;
}

function openDoor()
{
    status.innerHTML="Door Open";

    elevator.style.background="green";
}

function closeDoor()
{
    if(document.getElementById("doorBlock").checked)
    {
        alert("Door Blocked!");
        return;
    }

    status.innerHTML="Idle";

    elevator.style.background="#2196f3";
}

function stopLift()
{
    stopped=!stopped;

    if(stopped)
        status.innerHTML="Emergency Stop";
    else
        status.innerHTML="Idle";
}

function alarm()
{
    alert("Emergency Alarm Activated");

    speak("Emergency alarm activated");
}

function changeWeight(value)
{
    weight += value;

    if(weight<0)
        weight=0;

    weightDisplay.innerHTML=weight;

    if(weight>200)
    {
        alert("Overload!");

        speak("Elevator overloaded");
    }
}

function toggleDark()
{
    if(document.body.style.background=="white")
    {
        document.body.style.background="#222";
        document.body.style.color="white";
    }
    else
    {
        document.body.style.background="white";
        document.body.style.color="black";
    }
}

updateElevator();

</script>

</body>
</html>
