version: '3.8'

services:
  attendance-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-attendance-devops:latest
    container_name: student_attendance_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount host database folder to persist SQLite database
      - ./database:/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
