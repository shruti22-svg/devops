apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance-deployment
  labels:
    app: student-attendance
spec:
  # Single replica is best practice for SQLite single-file write locks
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: student-attendance-container
          image: student-attendance-devops:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/dashboard
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/dashboard
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: attendance-db-storage
              mountPath: /app/database
      volumes:
        - name: attendance-db-storage
          persistentVolumeClaim:
            claimName: attendance-db-pvc
